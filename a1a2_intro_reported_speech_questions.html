<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>So Many Questions! — Reported Speech</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28) document.documentElement.style.setProperty('--fs-base', fs + 'px');
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
.cast-row{ display:flex; flex-wrap:wrap; gap:14px 18px; justify-content:center; margin:0 0 1rem; padding:10px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--border-radius-lg); font-size:.8667rem; }
</style>
</head>
<body>
<div class="page" id="page">
  <span class="cefr-tag cefr-a1a2">A1/A2 · Elementary</span>
  <h1>So Many Questions!</h1>
  <p class="subtitle">It’s the morning after the family dinner. Ben was in the kitchen all evening. Lily tells him what Grandma and Grandpa asked.</p>

  <div class="sec-div">Before you read</div>
  <div id="preQuestions"></div>

  <div class="sec-div">The people</div>
  <div class="cast-row" id="castRow"></div>

  <div class="sec-div">The conversation</div>
  <button class="grammar-toggle-btn" id="grammarToggle">🎨 Show Grammar</button>
  <div class="pos-legend"></div>

  <div id="conversation"></div>

  <div class="sec-div">Check your answers</div>
  <div id="quiz"></div>

  <footer>So Many Questions! — Reported Speech: Questions (A1/A2)</footer>
</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>
<script src="stick-character.js"></script>
<script src="stick-sentence.js"></script>
<script>
/* the same family on every page of this lesson */
StickSentence.cast({
  ben:     { base:'boy',     colour:'#FF6600', label:'Ben' },
  lily:    { base:'girl',    colour:'#FF66CC', label:'Lily' },
  mum:     { base:'woman',   colour:'#CC0000', label:'Mom' },
  dad:     { base:'man',     colour:'#663300', label:'Dad' },
  grandma: { base:'grandma', label:'Grandma' },
  grandpa: { base:'grandpa', label:'Grandpa' },
  teacher: { base:'woman',   colour:'#666666', label:'The teacher' },
  mia:     { base:'woman',   colour:'#6600CC', label:'Mia' },
  leo:     { base:'man',     colour:'#0066CC', label:'Leo' },
  sam:     { base:'man',     colour:'#00CC66', label:'Sam' }
});

document.getElementById('castRow').innerHTML = [
  '{Ben|ben}', '{Lily (Ben’s sister)|lily}', '{Mom and Dad|mum,dad}', '{Grandma and Grandpa|grandma,grandpa}', '{Lily’s teacher|teacher}'
].map(StickSentence.html).join('');

const SPEAKERS = {
  Ben:  { cast: 'ben', avatar: '👦', av: 'av-a', side: 'left' },
  Lily: { cast: 'lily', avatar: '👧', av: 'av-b', side: 'right' }
};
/* each speaker's avatar takes the colour of their stick figure (overrides the house.css av-* colours) */
const avStyle = s => { const c = (StickSentence.cast()[s.cast] || {}).colour;
  return c ? 'background:' + c + '40;box-shadow:inset 0 0 0 2px ' + c : ''; };

/* {words|figures} puts stick figures over the words; [words/pos] marks the grammar colours */
const LINES = [
  ['Ben', '{[Lily/noun],|lily} [what/wh] [did/aux] {[Grandma/subject]|grandma} [ask/verb] {[you/object]|lily} [at dinner/prep]?'],
  ['Lily', '[Oh/none], [so many/det] [questions/noun]! {[She/subject]|grandma:say} [asked/verb] {[me/object]|lily} [how old/wh] {[I/subject]|lily} [was/verb]. {[She/subject]|grandma} [knows/verb] {[I’m/subject]|lily} [nine/complement]!'],
  ['Ben', '[Ha/none]! [What/wh] [else/adverb]?'],
  ['Lily', '{[She/subject]|grandma:say} [asked/verb] {[me/object]|lily} [what/wh] {[my/det]|lily} [favorite subject/subject] [was/verb]. [And/conj] {[she/subject]|grandma:say} [asked/verb] [if/conj] {[I/subject]|lily} [liked/verb] {[my/det]|lily} {[teacher/object].|teacher}'],
  ['Ben', '[Did/aux] {[Grandpa/subject]|grandpa} [ask/verb] {[you/object]|lily} [anything/object]?'],
  ['Lily', '[Yes/none]. {[He/subject]|grandpa:say} [asked/verb] {[me/object]|lily} [where/wh] {[you/subject]|ben} [were/verb].'],
  ['Ben', '{[I/subject]|ben} [was/verb] [in the kitchen/prep] [with/prep] {[Dad/object]!|dad}'],
  ['Lily', '{[I/subject]|lily} [know/verb]. [Then/time] {[he/subject]|grandpa:say} [asked/verb] {[Mom/object]|mum} [if/conj] {[she/subject]|mum:tired} [was/verb] [tired/adj]. [And/conj] {[he/subject]|grandpa:say} [asked/verb] {[Dad/object]|dad} [what/wh] {[he/subject]|dad:pan} [was cooking/verb].'],
  ['Ben', '[What/wh] [did/aux] {[Grandma/subject]|grandma} [ask/verb] {[Mom/object]?|mum}'],
  ['Lily', '{[She/subject]|grandma:say} [asked/verb] {[her/object]|mum} [if/conj] {[we/subject]|ben,lily} [watched/verb] [a lot of TV/object]!'],
  ['Ben', '[Oh no/none]! [What/wh] [did/aux] {[Mom/subject]|mum} [say/verb]?'],
  ['Lily', '{[She/subject]|mum:say} [told/verb] {[her/object]|grandma} {[we/subject]|ben,lily} [only/adverb] [watched/verb] [it/object] [on Saturdays/time].'],
  ['Ben', '[Phew/none]!']
];
const conv = document.getElementById('conversation');
LINES.forEach(([who, text]) => {
  const s = SPEAKERS[who], right = s.side === 'right';
  conv.insertAdjacentHTML('beforeend',
    '<div class="bubble-wrap' + (right ? ' right' : '') + '">' +
      '<div class="avatar ' + s.av + '" style="' + avStyle(s) + '">' + s.avatar + '</div>' +
      '<div class="bubble-col"><div class="bname' + (right ? ' right' : '') + '">' + who + '</div>' +
      '<div class="bubble ' + (right ? 'right' : 'left') + '">' + StickSentence.html(text) + '</div></div>' +
    '</div>');
});

const CQ_ITEMS = [
  { q: 'What did Grandma ask Lily first?', opts: ['Her favorite subject', 'How old she was', 'Where Ben was'], correct: 1 },
  { q: 'What did Grandpa ask Dad?', opts: ['If he was tired', 'Where Ben was', 'What he was cooking'], correct: 2 },
  { q: 'What did Grandma ask Mom?', opts: ['If the kids watched a lot of TV', 'If she liked her teacher', 'What she was cooking'], correct: 0 }
];
HouseComprehension.build({ pre: 'preQuestions', quiz: 'quiz', items: CQ_ITEMS });
</script>
<script>HouseGrammar.init();</script>
</body>
</html>
