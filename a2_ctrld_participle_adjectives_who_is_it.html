<script>
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28) document.documentElement.style.setProperty('--fs-base', fs + 'px');
  }catch(e){}
})();

<style>
  /* Zero-specificity fallbacks: only apply if house.css is missing. */
  :where(:root){
    --color-background-primary:#fff; --color-background-tertiary:#eeeef0;
    --color-background-info:#e6f1fb; --color-border-primary:#d4d4d8;
    --text-primary:#1a1a1a; --text-secondary:#5b5b60; --text-muted:#8b8b90; --text-accent:#185fa5;
    --surface-1:#f7f7f8; --surface-2:#fff; --border:#e3e3e6; --radius:12px;
    --bad:#b0392f; --good:#2f7d3a;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  :where(body){ font-family:var(--font-sans); color:var(--text-primary); background:var(--color-background-primary); margin:0; line-height:1.5; }
  :where(.page){ max-width:1000px; margin:0 auto; padding:28px 20px 80px; }

  /* Page-specific: everything is wp- prefixed. */
  .page{ max-width:1100px; }
  .wp-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:0.8571rem; color:var(--text-secondary); margin:14px 0 10px; }
  .wp-track{ flex:1; height:6px; border-radius:3px; background:var(--color-background-tertiary); overflow:hidden; }
  .wp-fill{ height:100%; width:0; background:var(--text-accent); transition:width .25s; }
  .wp-talk{ display:grid; gap:8px; margin-bottom:10px; }
  .wp-line{ display:grid; grid-template-columns:2.4rem minmax(0,1fr); gap:10px; align-items:start; }
  .wp-line.b{ grid-template-columns:minmax(0,1fr) 2.4rem; }
  .wp-face{ width:2.4rem; height:2.4rem; border-radius:50%; background:var(--surface-1); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
  .wp-bubble{ border:1px solid var(--border); border-radius:14px; background:var(--surface-2); padding:9px 14px; justify-self:start; max-width:100%; }
  .wp-line.b .wp-bubble{ background:var(--color-background-info); justify-self:end; }
  .wp-who{ display:block; font-size:0.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); }
  .wp-say{ font-size:1.1rem; } .wp-say strong{ color:var(--text-accent); }
  .wp-task{ font-size:0.8571rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin:10px 0 6px; }
  .wp-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-1); }
  .wp-scroll svg{ display:block; width:100%; min-width:860px; height:auto; -webkit-user-select:none; user-select:none; }
  .wp-scroll .wp-person{ cursor:pointer; }
  .wp-scroll .wp-person:focus{ outline:none; }
  .wp-scroll .wp-person:focus-visible .wp-hit{ stroke:#0066CC; stroke-width:4; }
  .wp-scroll.done .wp-person{ cursor:default; }
  .wp-scroll .wp-tags{ display:none; } .wp-scroll.done .wp-tags{ display:block; }
  .wp-foot{ display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:3rem; margin-top:10px; }
  .wp-fb{ font-weight:600; } .wp-fb.ok{ color:var(--good); } .wp-fb.no{ color:var(--bad); }
  .wp-next{ font-size:1rem; padding:8px 18px; }
  .wp-end{ text-align:center; padding:28px 8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); }
  .wp-end b{ font-size:2rem; display:block; margin:6px 0 12px; }
</style>

const HC=HouseCharacter;

const COLS=Object.values(COL);
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};

function wearPhrase(reg,id,col){const g=reg[id], c=HC.colourName(col||g.col); return g.pl?`${c} ${g.noun}`:`${art(c)} ${c} ${g.noun}`;}
const WARDROBE={
  female:{upper:['tshirt','blouse','coat','dress','sportstop','jacket','polo','hoodie'],lower:['jeans','skirt','trousers','shorts','leggings','bellbottoms','trackpants','cargopants'],foot:['sneakers','heels','boots','sandals','shoes','hikingboots']},
  male:{upper:['tshirt','shirt','coat','polo','tank','jacket','jacketopen','hoodie'],lower:['jeans','trousers','shorts','chinos','bellbottoms','trackpants','cargopants'],foot:['sneakers','shoes','boots','sandals','hikingboots']}};

  o=o||{}; const fem=o.fem!==undefined?o.fem:Math.random()<0.5, d=HC.defaults(), w=WARDROBE[fem?'female':'male'];

const LIP_COLS=['#CC0000','#CC0066','#FF6666','#990033','#CC3333'];
/* dress someone from the engine's outfit list: a real outfit, colours that match, and now and then one piece swapped */
function dress(d,ids,keep){
  const o=pick(HC.OUTFITS[d.bodyType].filter(x=>!ids||ids.includes(x.id))), w=WARDROBE[d.bodyType];
  d.upperGarment=o.upperGarment; d.lowerGarment=o.lowerGarment; d.footwear=o.footwear; d.accessories=o.tie?['tie']:[];
  if(!keep&&d.lowerGarment&&Math.random()<0.3){ if(Math.random()<0.5) d.lowerGarment=pick(w.lower); else d.upperGarment=pick(w.upper.filter(u=>u!=='dress')); }
  if(!['shirt','vest','jacket','jacketopen'].includes(d.upperGarment)) d.accessories=[];
  d.lowerColor=d.lowerGarment?pick(tone(LOWER_TONE[d.lowerGarment])):null;
  let uc, n=0; do{ uc=pick(tone(UPPER_TONE[d.upperGarment])); }while(uc===d.lowerColor&&++n<8);
  d.upperColor=uc; d.footwearColor=pick(tone(FOOT_TONE[d.footwear])); d.tieColor=pick(TONE.bright);
  if(['tshirt','shirt','blouse','dress','polo'].includes(d.upperGarment)&&Math.random()<0.2){ d.upperPattern=pick(['vstripes','hstripes','checkered','polka','floral','sidestripe']); d.upperColor2=d.upperColor==='#FFFFFF'?pick(TONE.bright):'#FFFFFF'; }
  if(['shorts','leggings'].includes(d.lowerGarment)&&Math.random()<0.2){ d.lowerPattern='sidestripe'; d.lowerColor2=d.lowerColor==='#FFFFFF'?pick(TONE.bright):'#FFFFFF'; }   /* sporty side stripe */

        HC.applyPose(d,'standing'); pose='standing'; d.held={left:null,right:one}; d.heldLeftGrip=d.heldRightGrip=null;
        if(one==='phone'){ d.head=pick(['front','left']); Object.assign(d.joints,PHONE_POSE[d.head]); }
        else Object.assign(d.joints,PARASOL_POSE);
      }
    }
    if(fem) d.facialHair='none';   /* never facial hair on women */
    /* two in eight (one girl, one boy) are teenagers: short or very short, and thin or very thin. Nobody else has both, so "boy" / "girl" is never ambiguous. */
    if(teen){ d.height=pick([1,2]); d.weight=pick([1,2]); d.facialHair='none'; if(d.hairColor==='grey') d.hairColor='4-0'; }
    else if(isTeen(d)) d.weight=3;
    if(i%3===0&&!d.headwear&&d.upperGarment!=='hoodieup'){   /* nothing on top of a raised hood */ d.headwear=(fem?hats:hatsM)[i%(fem?hats:hatsM).length]; d.headwearColor=pick(COLS); }
    if(i%5===1||(sc==='beach'&&i%3===2)) d.eyewear=d.eyewear||(sc==='beach'?pick(['sunglasses','aviators','sports']):pick(['glasses','sunglasses','round','aviators']));
    if(Math.random()<0.5) d.accessories.push(pick(S.acc.filter(a=>a!=='tie')));   /* the outfit decides about the tie */
    const fid=pick(FACES), f=allFaces.find(e=>e[0]===fid); d.eyebrows=f[2]; d.eyes=f[3]; d.mouth=f[4];
    if(d.upperGarment==='hoodieup') d.headwear=null;   /* nothing on top of a raised hood, helmets included */
    if(d.headwear) for(const h of ['left','right']) if(String(d.held[h]).startsWith('hat_')) d.held[h]=pick(['phone','book','bag','keys']);   /* wearing a hat: not holding one too */
    { /* hand shapes: a pointing arm points, a waving or raised arm shows an open palm; other empty hands rest by default */
      const sh={pointing:'hand_point',waving:'hand_open',reaching:'hand_open'}[pose];
      if(sh&&!seated&&!rider&&!skater){ const h=Math.abs(d.joints.shoulderL)>Math.abs(d.joints.shoulderR)?'left':'right'; if(!d.held[h]) d.held[h]=sh; } }
    for(const [h,k] of [['left','heldLeftGrip'],['right','heldRightGrip']]) if(['fork','knife','spoon'].includes(d.held[h])) d[k]=45;   /* cutlery is held at an angle, not straight along the hand */
    out.push({d:HC.normalize(d),seated,pose});
  }
  if(S.carY&&Math.random()<0.6){   /* at most one car, driving along the road in front */
    const fem=Math.random()<0.5, key=fem?'female':'male', name=pick(NAMES[key].filter(x=>!used[key].includes(x))); used[key].push(name);
    const d=person({fem,name,outfits:S.outfits,keep:true}); HC.applyPose(d,'chair'); Object.assign(d.joints,{shoulderL:60,elbowL:20,shoulderR:60,elbowR:20});
    d.prop='car'; d.propColor=pick(TONE.bright); d.held={left:null,right:null}; if(Math.random()<0.5) HC.mirror(d);
    out.push({d:HC.normalize(d),seated:false,pose:'driving',noTarget:true,fixed:{X:330+rand(540),Y:S.carY,s:0.56}});
  }
  if(S.seatSpots){ const spots=S.seatSpots();   /* seated people take fixed places, turned the way the place faces */
    out.filter(p=>p.seated).forEach((p,i)=>{ const q=spots[i]; if(!q) return;
      if((p.d.pelvisOrientation>0?1:-1)!==q.dir) p.d=HC.normalize(HC.mirror(p.d));
      p.fixed={X:q.X,Y:q.Y,s:0.5+0.3*(q.Y-HORIZON)/(H-HORIZON)};
      if(S.seatTable==='table'){   /* at a dining table: the plate goes on the table; anything else is held in the near hand, above the table top */
        const d=p.d, sg=d.pelvisOrientation>0?-1:1, near=sg>0?'left':'right', N=sg>0?'L':'R', Fa=sg>0?'R':'L';
        const it=d.held.left||d.held.right, grip=d.held.left?d.heldLeftGrip:d.heldRightGrip;
        d.held={left:null,right:null}; d.heldLeftGrip=d.heldRightGrip=null;
        if(['plate','cake','bowl'].includes(it)) p.onTable=it; else if(it){ d.held[near]=it; d[near==='left'?'heldLeftGrip':'heldRightGrip']=grip; }
        const up=it&&!p.onTable;
        Object.assign(d.joints,{['shoulder'+Fa]:sg*26,['elbow'+Fa]:sg*62,['wrist'+Fa]:0,['shoulder'+N]:sg*(up?40:22),['elbow'+N]:sg*(up?82:66),['wrist'+N]:0});
        p.d=HC.normalize(d); }
    });
    if(S.seatTable==='table'){   /* one table per position: a guest whose table would land where another guest's already stands does not get a second one */
      const placed=[];
      out.filter(p=>p.seated&&p.fixed).forEach(p=>{ const tx=p.fixed.X+(p.d.pelvisOrientation>0?1:-1)*128*p.fixed.s;
        if(placed.some(t=>Math.abs(t[0]-tx)<4&&Math.abs(t[1]-p.fixed.Y)<4)) p.noTable=true; else placed.push([tx,p.fixed.Y]); });
    } }
  if(S.band) for(const [id,X,Y,s] of S.band()){
    const d=musician(id), key=d.bodyType, name=pick(NAMES[key].filter(x=>!used[key].includes(x))); used[key].push(name); d.name=name;
    out.push({d,seated:false,pose:'playing',role:ROLE[id],fixed:{X,Y,s}});
  }
  return out;
}
/* ── shared: positions, pointing and participle descriptions for a scene ── */
/* place everyone once per scene; positions are kept so "by the window" stays true */
function layout(sc,people){
  const S=SCENES[sc], [y0,y1]=S.depth, reg=people.filter(p=>!p.fixed), n=reg.length, ys=shuffle(reg.map((_,i)=>y0+(y1-y0)*i/(n-1))), slot=(W-200)/(n-1);
  reg.forEach((p,i)=>{ p.X=100+slot*i+(Math.random()*40-20); p.Y=ys[i];
    if(S.seatSpots&&!S.stageX) p.Y=y0+Math.random()*44;   /* where the seats are in rows, people on their feet stand at the back wall, clear of the chairs */
    if(S.stageX&&p.X>S.stageX[0]-30&&p.X<S.stageX[1]+30) p.Y=y1-Math.random()*64;   /* in front of the stage: stay at the very front, so the band is not hidden */
    p.s=0.5+0.3*(p.Y-HORIZON)/(H-HORIZON); });
  { const sp=standSpots(S,people); if(sp) reg.forEach((p,i)=>{ p.X=sp[i][0]; p.Y=sp[i][1]; p.s=0.5+0.3*(p.Y-HORIZON)/(H-HORIZON); }); }   /* dining tables: keep clear of the seated guests */
  /* a landmark belongs to the one person standing clearly nearest to it, toward the back of the scene */
  people.forEach(p=>p.place=null);
  for(const m of S.marks){
    const near=reg.filter(p=>Math.abs(p.X-m.x)<120&&p.Y<y0+(y1-y0)*0.6).sort((a,b)=>Math.abs(a.X-m.x)-Math.abs(b.X-m.x));
    if(near.length===1&&Math.abs(near[0].X-m.x)<85&&!near[0].place){ const p=near[0]; p.place=m.t;
      p.X=m.x+(Math.random()*20-10); p.Y=y0+Math.random()*14; p.s=0.5+0.3*(p.Y-HORIZON)/(H-HORIZON); }   /* moved right up to it, at the back of the room */
  }
  /* sizes and pointing are worked out last, from the final positions */
  people.forEach(p=>{ if(p.fixed) Object.assign(p,p.fixed); else aim(p,S);   /* musicians keep their place on the stage */
    faceTable(sc,p,p.X,p.s); const fit=HC.render(p.d,{fit:true}).match(/viewBox="([^"]+)"/)[1].split(' ').map(Number); p.h=(fit[3]-16)*p.s; p.w=Math.max(70,(fit[2]-16)*p.s); });
}
/* someone "pointing" really points: at a named thing in the scene, with the arm on that side, and looks at it */
function aim(p,S){
  p.pointAt=null; if(p.pose!=='pointing'||!S.targets) return;
  const d=p.d; for(const h of ['left','right']) if((HC.ITEMS[d.held[h]]||{}).hand) d.held[h]=null;   /* the hand shape is set again below, on the arm that ends up pointing */
  const T=pick(S.targets.filter(t=>Math.abs(t[1]-p.X)>90)), arm=T[1]<p.X?'R':'L', other=arm==='R'?'L':'R', hand=arm==='R'?'right':'left', free=arm==='R'?'left':'right';
  if(d.held[hand]){ d.held={left:null,right:null,[free]:d.held[hand]}; [d.heldLeftGrip,d.heldRightGrip]=[d.heldRightGrip,d.heldLeftGrip]; }
  Object.assign(d.joints,{torso:0,neck:0,['shoulder'+other]:other==='L'?-8:8,['elbow'+other]:other==='L'?-5:5,['wrist'+other]:0,['elbow'+arm]:0,['wrist'+arm]:0});
  d.torsoOrientation=0; d.pelvisOrientation=0; d.head=T[1]<p.X?'left':'right';
  holdPose(d,free); d.held[hand]='hand_point';
  const pv=HC.pivots(d)['shoulder'+arm], sx=p.X+(pv.x-HC.STAGE.cx)*p.s, sy=p.Y+(pv.y-HC.STAGE.ground)*p.s;
  d.joints['shoulder'+arm]=Math.round(Math.atan2(-(T[1]-sx),T[2]-sy)*180/Math.PI);   /* limb angle 0 = straight down, clockwise */
  p.d=HC.normalize(d); p.pointAt=T[0];
}
/* everything true of one person, as participle phrases: [kind, text] */
function facts(p,sc){
  const d=p.d, f=[];
  if(p.role) f.push(['action',p.role]);   /* a musician on the stage */
  if(d.upperGarment) f.push(['top','wearing '+wearPhrase(HC.UPPER,d.upperGarment,d.upperColor)]);
  if(d.lowerGarment) f.push(['bottom','wearing '+wearPhrase(HC.LOWER,d.lowerGarment,d.lowerColor)]);
  if(d.headwear) f.push(['hat','wearing '+wearPhrase(HC.HEADWEAR,d.headwear,d.headwearColor)]);
  if(d.eyewear) f.push(['eyes','wearing '+HC.EYEWEAR[d.eyewear].phrase]);
  if(d.accessories.includes('backpack')) f.push(['pack','carrying a backpack']);
  for(const h of ['left','right']){ const it=HC.ITEMS[d.held[h]]; if(it&&!it.hand) f.push(['item',`${it.verb} ${it.phrase}`]); }
  if(p.seated) f.push(['seat',sc==='beach'?'sitting on a beach chair':'sitting on a chair']);
  if(p.place&&(p.seated||!['walking','riding','skating','driving'].includes(p.pose))) f.push(['place',(p.seated?'sitting ':'standing ')+p.place]);   /* only people who really are standing or sitting there */
  if(!p.seated){ const act={waving:'waving',walking:'walking',reaching:'raising a hand',riding:'riding a bicycle',skating:'riding a skateboard',driving:'driving a car'}[p.pose]; if(act) f.push(['action',act]);
    if(p.pose==='pointing'&&p.pointAt) f.push(['action','pointing at '+p.pointAt]); }
  return f;
}
/* boy / girl for the teenagers (short and thin), man / woman for everyone else */
const noun=d=>{const fem=d.bodyType==='female'; return isTeen(d)?(fem?'girl':'boy'):(fem?'woman':'man');};
/* ── Controlled practice: find the person the friend describes ─────────── */
const $=id=>document.getElementById(id);
const PER_SCENE=4, SCENE_COUNT=3;

/* visitor lines — {N} name, {s}he, {o} him/her, {p} his/her */
const OPENERS=[   /* avatars are always people, never objects */
  ['🧑‍🔧','Delivery driver','I have a package for {N}.'],['🧑‍🍳','Pizza delivery','Pizza for {N}!'],['🧔','Taxi driver','Which one is {N}? {S} left {p} phone in my taxi.'],
  ['🧑‍🏫','New teacher','I\'m looking for {N}. Is {s} here?'],['👩‍🌾','Florist','These flowers are for {N}.'],['🧑‍💼','Receptionist','There\'s a phone call for {N}.'],
  ['🙋','New student','Excuse me, who is {N}?'],['👵','Neighbour','I found {N}\'s keys. Where is {s}?'],['👨‍🦱','Mail carrier','I have a letter for {N}.'],
  ['👩‍🦰','Photographer','I need a photo of {N}. Which one is {s}?'],['🤵','Waiter','This coffee is for {N}.'],['👮','Police officer','I need to talk to {N}. Can you see {o}?']];
const REPLIES=['{S}\'s the {W} {D}.','{N}? {S}\'s the {W} {D}.','That\'s {N} — the {W} {D}.','Over there. {S}\'s the {W} {D}.','Look for the {W} {D}. That\'s {o}.'];

let rounds=[], ri=0, score=0, cur=null, answered=false;
function buildGame(){
  rounds=[]; const openers=shuffle(OPENERS);
  for(const sc of shuffle(Object.keys(SCENES)).slice(0,SCENE_COUNT)){
    const people=cast(sc); layout(sc,people);
    const all=people.map(p=>facts(p,sc)), count=t=>all.filter(f=>f.some(x=>x[1]===t)).length, usedKinds=[]; let made=0;
    for(const i of shuffle(people.map((_,k)=>k)).filter(k=>!people[k].noTarget)){   /* the driver is never the person to find */
      if(made>=PER_SCENE) break;
      const uniq=shuffle(all[i].filter(x=>count(x[1])===1));
      /* vary the kind of description: places, actions and things first, clothes after */
      const order=['place','action','item','seat','pack','hat','top','eyes','bottom'];
      uniq.sort((x,y)=>order.indexOf(x[0])-order.indexOf(y[0]));
      let pickd=uniq.find(x=>!usedKinds.includes(x[0]))||uniq[0], text=pickd&&pickd[1];
      if(!pickd){   /* nothing unique on its own: join two facts that only this person has together */
        const f=all[i]; outer: for(let a=0;a<f.length;a++) for(let b=a+1;b<f.length;b++){
          if(all.filter(g=>g.some(x=>x[1]===f[a][1])&&g.some(x=>x[1]===f[b][1])).length===1){ pickd=f[a]; text=`${f[a][1]} and ${f[b][1]}`; break outer; } }
      }
      if(!pickd) continue;
      usedKinds.push(pickd[0]); made++;
      rounds.push({sc,people,target:i,text,opener:openers[rounds.length%openers.length],reply:pick(REPLIES)});
    }
  }
}
const fill=(tpl,p,text)=>{const fem=p.d.bodyType==='female', S=fem?'She':'He';
  return tpl.replace(/\{N\}/g,p.d.name).replace(/\{S\}/g,S).replace(/\{s\}/g,S.toLowerCase()).replace(/\{o\}/g,fem?'her':'him').replace(/\{p\}/g,fem?'her':'his').replace(/\{W\}/g,noun(p.d)).replace(/\{D\}/g,`<strong>${text}</strong>`);};

function drawScene(r){
  const S=SCENES[r.sc]; let figs=[], tags='';
  r.people.forEach((p,i)=>{
    const body=HC.render(p.d).replace(/^<svg [^>]*>/,'').replace(/<\/svg>$/,'');
    { const t=tableFor(r.sc,p,p.X,p.Y,p.s); if(t) figs.push({Y:p.Y+0.5,svg:t+nearArm(p,body,p.X,p.Y,p.s)}); }
    figs.push({Y:p.Y,svg:`<g class="wp-person" data-i="${i}" tabindex="0" role="button" aria-label="Person ${i+1}">${shadow(p,p.X,p.Y,p.s,'wp-ring')}`
      +`<g transform="translate(${p.X-HC.STAGE.cx*p.s} ${p.Y-HC.STAGE.ground*p.s}) scale(${p.s})">${body}</g>`
      +`<rect class="wp-hit" x="${p.X-p.w/2}" y="${p.Y-p.h-6}" width="${p.w}" height="${p.h+14}" rx="10" fill="#fff" fill-opacity="0" stroke="none"/></g>`});
    const w=p.d.name.length*10+22;
    tags+=`<g transform="translate(${p.X} ${Math.max(22,p.Y-p.h-16)})"><rect x="${-w/2}" y="-15" width="${w}" height="24" rx="12" fill="${i===r.target?'#d9f2dc':'#fff'}" stroke="${i===r.target?'#2f7d3a':'#333'}" stroke-width="${i===r.target?3:1.5}"/><text y="3" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="var(--font-sans,sans-serif)">${p.d.name}</text></g>`;
  });
  figs.sort((a,b)=>a.Y-b.Y);
  $('wpScene').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="group" aria-label="${S.label} scene. Tap a person.">${S.bg()}${figs.map(f=>f.svg).join('')}<g class="wp-tags">${tags}</g></svg>`;
  /* the tap area is the whole figure, including anything it holds or rides */
  $('wpScene').querySelectorAll('.wp-person').forEach(g=>{ const h=g.querySelector('.wp-hit'); h.setAttribute('width',0); h.setAttribute('height',0);
    const b=g.getBBox(); h.setAttribute('x',b.x-4); h.setAttribute('y',b.y-4); h.setAttribute('width',b.width+8); h.setAttribute('height',b.height+8); });
}
function show(){
  $('wpScore').textContent=score; $('wpFill').style.width=(ri/rounds.length*100)+'%';
  if(ri>=rounds.length){
    $('wpCount').textContent='Finished';
    $('wpBody').innerHTML=`<div class="wp-end">You found<b>${score} / ${rounds.length}</b><button class="wp-next" id="wpAgain" type="button">Play again with new people</button></div>`;
    $('wpAgain').addEventListener('click',()=>location.reload()); return;
  }
  const r=rounds[ri], t=r.people[r.target]; cur=r; answered=false;
  $('wpCount').textContent=`Question ${ri+1} of ${rounds.length}`;
  $('wpTalk').innerHTML=`<div class="wp-line"><span class="wp-face" aria-hidden="true">${r.opener[0]}</span><div class="wp-bubble"><span class="wp-who">${r.opener[1]}</span><span class="wp-say">${fill(r.opener[2],t,'')}</span></div></div>`
    +`<div class="wp-line b"><div class="wp-bubble"><span class="wp-who">Friend</span><span class="wp-say">${fill(r.reply,t,r.text)}</span></div><span class="wp-face" aria-hidden="true">👩‍🦳</span></div>`;
  $('wpTask').textContent=`Tap ${t.d.name} in the picture`;
  $('wpScene').classList.remove('done'); drawScene(r);
  $('wpFb').textContent=''; $('wpFb').className='wp-fb'; $('wpNext').hidden=true;
}
function answer(i){
  if(answered||!cur) return; answered=true;
  const r=cur, t=r.people[r.target], ok=i===r.target; if(ok) score++;
  const ring=(k,col)=>{const e=$('wpScene').querySelector(`.wp-person[data-i="${k}"] .wp-ring`); e.setAttribute('fill',col); e.setAttribute('opacity','.75');};
  ring(r.target,'#2f9e44'); if(!ok) ring(i,'#d63a2f');
  $('wpScene').classList.add('done');
  const fem=t.d.bodyType==='female';
  $('wpFb').className='wp-fb '+(ok?'ok':'no');
  $('wpFb').innerHTML=ok?`Yes! ${t.d.name} is the ${noun(t.d)} ${r.text}.`:`Not quite — that's ${r.people[i].d.name}. ${t.d.name} is the ${noun(t.d)} ${r.text}.`;
  $('wpScore').textContent=score; $('wpNext').hidden=false; $('wpNext').textContent=ri===rounds.length-1?'See my score':'Next →'; $('wpNext').focus();
}
$('wpScene').addEventListener('click',e=>{const g=e.target.closest('.wp-person'); if(g) answer(+g.dataset.i);});
$('wpScene').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.wp-person'); if(g){e.preventDefault();answer(+g.dataset.i);} } });
$('wpNext').addEventListener('click',()=>{ri++;show();});
buildGame(); show();

})();
</script>
