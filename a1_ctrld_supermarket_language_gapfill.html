<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Supermarket Language — Gap Fill</title>
<script>
// Applies the saved/system theme to <html> as early as possible, before the
// stylesheet below paints anything, so there's no flash of the wrong theme.
// Self-contained: no dependency on any external script.
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    // Same idea for the text size: apply it before house.css paints, so a
    // person who chose 28px doesn't watch the page reflow from 14px on load.
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28){
      document.documentElement.style.setProperty('--fs-base', fs + 'px');
    }
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
/* Page-specific design tokens — this lesson's own palette, not
   house tokens. house.css owns everything else. */
:root{
  --pos-yes: #1a7f37;
  --pos-no: #c03434;
}
@media (prefers-color-scheme: dark) {
:root{
  --pos-yes: #6fd08c;
  --pos-no: #f08a8a;
}
}


h1 { font-size: 1.3rem; margin: 4px 0 2px; }
  .gf-context { font-size: 1.3rem; margin-bottom: 8px; }
  .gf-sentence { font-size: 0.97rem; margin-bottom: 8px; }

  .gf-check {
    margin-top: 10px; padding: 7px 16px; border-radius: 8px; border: none;
    background: var(--text-accent); color: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .gf-feedback { font-size: 0.82rem; margin-top: 8px; font-weight: 600; min-height: 1.1em; }
  .gf-feedback.ok { color: var(--pos-yes); }
  .gf-feedback.bad { color: var(--pos-no); }
</style>
</head>
