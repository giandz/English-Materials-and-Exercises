<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Compound Nouns — Practice</title>
<script>
// Applies the saved/system theme to <html> as early as possible, before the
// stylesheet below paints anything, so there's no flash of the wrong theme.
// Self-contained: no dependency on any external script.
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    // Same idea for the text size: apply it before house.css paints, so a
    // person who chose 28px doesn't watch the page reflow from 14px on load.
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28){
      document.documentElement.style.setProperty('--fs-base', fs + 'px');
    }
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="page" id="page">
  <span class="cefr-tag cefr-a1">A1 · Beginner</span>


<div style="padding:1.25rem 0;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px;">
    <div style="font-size:0.9333rem;color:var(--color-text-secondary);">Click a compound noun, then click its definition.</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="score-label" style="font-size:0.9333rem;color:var(--color-text-secondary);">0 / 12 matched</span>
      <button onclick="resetGame()">↺ Restart</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;">
    <div>
      <div class="col-label">Compound nouns</div>
      <div id="nouns-col" style="display:flex;flex-direction:column;gap:7px;"></div>
    </div>
    <div>
      <div class="col-label">Definitions</div>
      <div id="defs-col" style="display:flex;flex-direction:column;gap:7px;"></div>
    </div>
  </div>

  <div id="feedback" style="margin-top:1rem;min-height:24px;font-size:0.9333rem;text-align:center;color:var(--color-text-secondary);"></div>

  <details style="margin-top:1.25rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden;">
    <summary style="padding:9px 14px;cursor:pointer;font-size:0.9333rem;font-weight:500;background:var(--color-background-secondary);list-style:none;display:flex;justify-content:space-between;align-items:center;">Answer key <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:1rem;color:var(--color-text-secondary);"></i></summary>
    <div style="padding:10px 14px;display:flex;flex-direction:column;gap:4px;" id="answer-key"></div>
  </details>
</div>



</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>
<script>
function buildKey(){
  const el=document.getElementById('answer-key');
  pairs.forEach((p,i)=>{
    const row=document.createElement('div');
    row.style.cssText='font-size:0.8667rem;display:flex;gap:8px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);';
    row.innerHTML='<span style="color:var(--color-text-secondary);min-width:20px;">'+(i+1)+'.</span><span style="font-weight:500;min-width:110px;color:#185fa5;">'+p.noun+'</span><span style="color:var(--color-text-secondary);">'+p.def+'</span>';
    el.appendChild(row);
  });
  const last=el.lastChild;if(last)last.style.borderBottom='none';
}

const pairs = [
  { noun:"bus stop",    def:"where you wait for the bus" },
  { noun:"living room", def:"the main room in a house" },
  { noun:"school bag",  def:"the bag you carry to school" },
  { noun:"lunch box",   def:"the box with food for lunch" },
  { noun:"alarm clock", def:"a clock that wakes you up" },
  { noun:"post office", def:"where you send letters and parcels" },
  { noun:"car park",    def:"where you leave your car" },
  { noun:"phone call",  def:"when you ring someone" },
  { noun:"bus driver",  def:"the person who drives the bus" },
  { noun:"school day",  def:"a day when you go to school" },
  { noun:"coffee shop", def:"a place where you buy coffee" },
  { noun:"dinner table",def:"the table where you eat dinner" },
];

const game = HouseMatching.build({
  left: 'nouns-col', right: 'defs-col',
  pairs: pairs, leftKey: 'noun', rightKey: 'def',
  feedbackEl: 'feedback',
  onScore: function (done, total) {
    document.getElementById('score-label').textContent = done + ' / ' + total + ' matched';
  }
});

// The Restart button on this page is wired with an inline onclick.
window.resetGame = game.render;

buildKey();
</script>
</body>
</html>
