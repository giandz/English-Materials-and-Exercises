<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>What Are They Wearing? — Controlled practice</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28) document.documentElement.style.setProperty('--fs-base', fs + 'px');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
  /* Zero-specificity fallbacks: only apply if house.css is missing. */
  :where(:root){
    --color-background-primary:#fff; --color-background-tertiary:#eeeef0;
    --color-background-info:#e6f1fb; --color-border-primary:#d4d4d8;
    --text-primary:#1a1a1a; --text-secondary:#5b5b60; --text-muted:#8b8b90; --text-accent:#185fa5;
    --surface-1:#f7f7f8; --surface-2:#fff; --border:#e3e3e6; --radius:12px;
    --bad:#b0392f; --good:#2f7d3a;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  :where(body){ font-family:var(--font-sans); color:var(--text-primary); background:var(--color-background-primary); margin:0; line-height:1.5; }
  :where(.page){ max-width:1000px; margin:0 auto; padding:28px 20px 80px; }

  /* Page-specific: everything is wq- prefixed. */
  .wq-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:0.8571rem; color:var(--text-secondary); margin:14px 0 8px; }
  .wq-track{ flex:1; height:6px; border-radius:3px; background:var(--color-background-tertiary); overflow:hidden; }
  .wq-fill{ height:100%; width:0; background:var(--text-accent); transition:width .25s; }
  .wq-card{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); padding:16px; }
  .wq-prompt{ font-size:0.8571rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin:0 0 10px; }
  .wq-sentence{ font-size:1.35rem; font-weight:600; text-align:center; margin:4px 0 16px; }
  .wq-figure{ background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:26px 12px 10px; display:flex; justify-content:center; }
  .wq-figure svg{ height:min(52vh,380px); width:auto; max-width:100%; overflow:visible; }
  .wq-opts{ display:grid; gap:10px; margin-top:14px; }
  .wq-opts.pics{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .wq-opt{ font:inherit; font-size:1.05rem; text-align:left; padding:12px 14px; border:2px solid var(--color-border-primary); border-radius:12px; background:var(--color-background-primary); color:var(--text-primary); cursor:pointer; }
  .wq-opts.pics .wq-opt{ padding:22px 6px 8px; background:var(--surface-1); display:flex; justify-content:center; }
  .wq-opts.pics svg{ height:min(40vh,300px); width:auto; max-width:100%; overflow:visible; pointer-events:none; }
  .wq-opt:hover:not(:disabled){ border-color:var(--text-accent); }
  .wq-opt:disabled{ cursor:default; }
  .wq-opt.right{ border-color:var(--good); box-shadow:0 0 0 2px var(--good) inset; }
  .wq-opt.wrong{ border-color:var(--bad); opacity:.75; }
  .wq-opt.dim{ opacity:.5; }
  .wq-foot{ display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:3rem; margin-top:12px; }
  .wq-fb{ font-weight:600; } .wq-fb.ok{ color:var(--good); } .wq-fb.no{ color:var(--bad); }
  .wq-next{ font-size:1rem; padding:8px 18px; }
  .wq-end{ text-align:center; padding:24px 8px; }
  .wq-end b{ font-size:2rem; display:block; margin:6px 0 12px; }
  @media (max-width:560px){ .wq-opts.pics svg{ height:min(30vh,210px); } .wq-sentence{ font-size:1.15rem; } }
</style>
</head>
<body>
<div class="page" id="page">
  <span class="cefr-tag cefr-a1">A1 · Beginner</span>
  <h1>What are they wearing?</h1>
  <p class="subtitle">Present continuous: <em>wearing</em>, <em>carrying</em>, <em>holding</em>. Look carefully and choose.</p>
  <div class="wq-bar"><span id="wqCount"></span><div class="wq-track"><div class="wq-fill" id="wqFill"></div></div><span>Score: <b id="wqScore">0</b></span></div>
  <div class="wq-card" id="wqCard"></div>
</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>

<!-- HouseCharacter engine (shared file) -->
<script src="house-character.js"></script>

<script>
(function(){
/* ── shared: random, well-described people built on HouseCharacter ─────── */
const HC=HouseCharacter;
const COL={red:'#CC0000',blue:'#0066CC',green:'#00CC66',yellow:'#FFCC00',black:'#000000',white:'#FFFFFF',pink:'#FF66CC',purple:'#6600CC',orange:'#FF6600',grey:'#666666',brown:'#663300'};
const COLS=Object.values(COL);
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clone=o=>JSON.parse(JSON.stringify(o));
const NAMES={female:['Ana','Maya','Sofia','Lucy','Emma','Zoe','Nora','Rosa','Amy','Lina','Kim','Eva','Mia','Sara','Julia','Carla'],
             male:['Leo','Sam','Tom','Omar','Luis','Ben','Dan','Max','Ivan','Raj','Ken','Noah','Pablo','Hugo','Alex','Marco']};
const art=w=>/^[aeiou]/i.test(w)?'an':'a';
function wearPhrase(reg,id,col){const g=reg[id], c=HC.colourName(col||g.col); return g.pl?`${c} ${g.noun}`:`${art(c)} ${c} ${g.noun}`;}
const WARDROBE={
  female:{upper:['tshirt','blouse','coat','dress','sportstop','jacket','polo'],lower:['jeans','skirt','trousers','shorts','leggings','bellbottoms'],foot:['sneakers','heels','boots','sandals','shoes']},
  male:{upper:['tshirt','shirt','coat','polo','tank','jacket','jacketopen'],lower:['jeans','trousers','shorts','chinos','bellbottoms'],foot:['sneakers','shoes','boots','sandals']}};
function person(o){
  o=o||{}; const fem=o.fem!==undefined?o.fem:Math.random()<0.5, d=HC.defaults(), w=WARDROBE[fem?'female':'male'];
  d.bodyType=fem?'female':'male'; d.name=o.name||pick(NAMES[d.bodyType]);
  d.skin=1+rand(6); d.eyeColor=1+rand(16); d.hairColor=pick(['1-0','3-0','4-0','5-0','6-0','7-0','8-0','5-7','7-77','grey']);
  d.hairStyle=pick(fem?['bob','long','ponytail','bun','pigtails','curly','afro','short']:['short','crew','sidepart','buzz','curly','afro','pompadour','bald']);
  d.facialHair=fem?'none':pick(['none','none','none','stubble','moustache','beard','goatee']);
  d.height=pick([2,3,3,4]); d.weight=pick([2,3,3,4]);
  if(o.outfits){ dress(d,o.outfits,o.keep); return d; }
  const cs=shuffle(COLS);
  d.upperGarment=pick(o.upper||w.upper); d.upperColor=cs[0];
  d.lowerGarment=d.upperGarment==='dress'?null:pick(o.lower||w.lower); d.lowerColor=cs[1];
  d.footwear=pick(w.foot); d.footwearColor=pick(['#000000','#663300','#FFFFFF','#CC0000']);
  return d;
}
/* colour families that sit well together, by kind of garment */
const TONE={dark:['#000000','#000066','#666666','#663300'],denim:['#000066','#0066CC','#666666','#000000'],
  light:['#FFFFFF','#CCCCFF','#CCFFFF','#FFCCCC','#FFFFCC','#CCFFCC'],bright:['#CC0000','#0066CC','#00CC66','#FFCC00','#FF66CC','#6600CC','#FF6600','#00CCCC'],
  earth:['#663300','#CCCC66','#666600','#CC6600','#666666'],shoeDark:['#000000','#663300'],shoeAny:['#FFFFFF','#000000','#CC0000','#0066CC']};
const UPPER_TONE={tshirt:'bright',polo:'bright',tank:'bright',sportstop:'bright',shirt:'light',blouse:'light',coat:['dark','bright'],jacket:'dark',jacketopen:'dark',vest:'dark',dress:'bright',gown:['bright','dark']};
const LOWER_TONE={jeans:'denim',bellbottoms:'denim',trousers:'dark',chinos:'earth',shorts:['earth','denim','bright'],leggings:'dark',skirt:['bright','dark']};
const FOOT_TONE={sneakers:'shoeAny',shoes:'shoeDark',boots:'shoeDark',sandals:'shoeDark',heels:['bright','shoeDark'],platforms:'bright',socks:'light'};
const tone=t=>TONE[Array.isArray(t)?pick(t):t||'bright'];
/* dress someone from the engine's outfit list: a real outfit, colours that match, and now and then one piece swapped */
function dress(d,ids,keep){
  const o=pick(HC.OUTFITS[d.bodyType].filter(x=>!ids||ids.includes(x.id))), w=WARDROBE[d.bodyType];
  d.upperGarment=o.upperGarment; d.lowerGarment=o.lowerGarment; d.footwear=o.footwear; d.accessories=o.tie?['tie']:[];
  if(!keep&&d.lowerGarment&&Math.random()<0.3){ if(Math.random()<0.5) d.lowerGarment=pick(w.lower); else d.upperGarment=pick(w.upper.filter(u=>u!=='dress')); }
  if(!['shirt','vest','jacket','jacketopen'].includes(d.upperGarment)) d.accessories=[];
  d.lowerColor=d.lowerGarment?pick(tone(LOWER_TONE[d.lowerGarment])):null;
  let uc, n=0; do{ uc=pick(tone(UPPER_TONE[d.upperGarment])); }while(uc===d.lowerColor&&++n<8);
  d.upperColor=uc; d.footwearColor=pick(tone(FOOT_TONE[d.footwear])); d.tieColor=pick(TONE.bright);
  if(['tshirt','shirt','blouse','dress','polo'].includes(d.upperGarment)&&Math.random()<0.2){ d.upperPattern=pick(['vstripes','hstripes','checkered','polka','floral']); d.upperColor2=d.upperColor==='#FFFFFF'?pick(TONE.bright):'#FFFFFF'; }
  return o.id;
}
/* bend an arm so the item in that hand is easy to see */
function holdPose(d,hand){
  const it=d.held[hand]; if(!it||d.torsoOrientation) return;
  const S=hand==='left'?'L':'R', sg=hand==='left'?-1:1;
  if(it==='umbrella'||it==='parasol'){ d.joints['shoulder'+S]=sg*20; d.joints['elbow'+S]=sg*140; }
  else if(['cup','mug','bowl','plate','cake','pizzabox','phone','tablet','book','multimeter','flashlight','wrench','hammer','basketball','soccerball','volleyball','beachball','tennisball','baseball','football','screwdriver','paintbrush','spoon','fork','pan','microphone','trumpet','maraca','tambourine','flute','violin','drumstick'].includes(it)){ d.joints['shoulder'+S]=sg*12; d.joints['elbow'+S]=-sg*82; }
}

/* ── Controlled practice: choose the sentence, or choose the person ────── */
/* basic words only: every garment and item used here has a simple, common name */
const BASIC={upper:{female:['tshirt','shirt','coat','jacket','dress'],male:['tshirt','shirt','coat','jacket']},
             lower:{female:['jeans','trousers','shorts','skirt'],male:['jeans','trousers','shorts']}};
const HATS=['cap','sunhat'], SPECS=['glasses','sunglasses'], NOUN={sunhat:'hat'};
const THINGS=['book','phone','cup','basketball','bag','suitcase','teddy','keys','guitar'], SIMPLE={basketball:'a ball'};
const named=(reg,id,col)=>{const g=reg[id], k=HC.colourName(col||g.col), n=NOUN[id]||g.noun; return g.pl?`${k} ${n}`:`${art(k)} ${k} ${n}`;};
const hatPhrase=(id,c)=>named(HC.HEADWEAR,id,c);

/* One question. kind = which feature is tested; twist = what the two wrong options change. */
function makeQ(kind,twist,mode){
  const fem=Math.random()<0.5, sex=fem?'female':'male', w={upper:BASIC.upper[sex],lower:BASIC.lower[sex]};
  const base=person({fem,upper:kind==='lower'?w.upper.filter(x=>x!=='dress'):w.upper,lower:w.lower});
  const He=fem?'She':'He';
  const others=(list,cur,n)=>shuffle(list.filter(x=>x!==cur)).slice(0,n);
  let vars=[], say;
  if(kind==='upper'||kind==='lower'){
    const G=kind+'Garment', C=kind+'Color', reg=kind==='upper'?HC.UPPER:HC.LOWER, list=(kind==='upper'?w.upper:w.lower).filter(x=>x!=='dress'&&x!=='jacketopen');
    if(!list.includes(base[G])) base[G]=pick(list);
    if(!base.lowerGarment) base.lowerGarment=pick(w.lower);
    say=d=>`${He}'s wearing ${named(reg,d[G],d[C])}.`;
    const g2=others(list.filter(x=>reg[x].noun!==reg[base[G]].noun),base[G],2), c2=others(COLS.filter(c=>c!==base[kind==='upper'?'lowerColor':'upperColor']),base[C],2);
    vars=twist==='thing'?g2.map(g=>({[G]:g})):twist==='colour'?c2.map(c=>({[C]:c})):[{[G]:g2[0]},{[C]:c2[0]}];
  } else if(kind==='head'){
    base.headwear=pick(HATS); base.headwearColor=pick(COLS); if(['afro','bun','pompadour'].includes(base.hairStyle)) base.hairStyle='short';
    say=d=>`${He}'s wearing ${hatPhrase(d.headwear,d.headwearColor)}.`;
    const h2=others(HATS,base.headwear,2), c2=others(COLS,base.headwearColor,2);
    vars=twist==='colour'?c2.map(c=>({headwearColor:c})):[{headwear:h2[0]},{headwearColor:c2[0]}];
  } else if(kind==='eye'){
    base.eyewear=pick(SPECS); const hc=pick(COLS);
    say=d=>`${He}'s wearing ${d.eyewear?HC.EYEWEAR[d.eyewear].phrase:hatPhrase(d.headwear,d.headwearColor)}.`;
    vars=[{eyewear:others(SPECS,base.eyewear,1)[0]},{eyewear:null,headwear:'cap',headwearColor:hc}];
  } else {
    const hand=pick(['left','right']); base.held[hand]=pick(THINGS);
    say=d=>{const it=HC.ITEMS[d.held[hand]]; return `${He}'s ${it.verb} ${SIMPLE[d.held[hand]]||it.phrase}.`;};
    vars=others(THINGS,base.held[hand],2).map(t=>({held:{left:null,right:null,[hand]:t}}));
  }
  const people=[base].concat(vars.map(v=>Object.assign(clone(base),clone(v))));
  people.forEach(p=>{ ['left','right'].forEach(h=>holdPose(p,h)); });
  const opts=shuffle(people.map((p,i)=>({p,text:say(p),ok:i===0})));
  return {mode,base,sentence:say(base),opts};
}
/* easiest → hardest: different things first, then colours, then choosing the person */
const PLAN=[['upper','thing','A'],['item','thing','A'],['head','mixed','A'],['lower','thing','A'],['upper','colour','A'],
            ['item','thing','B'],['upper','mixed','B'],['eye','thing','B'],['lower','colour','B'],['head','mixed','B']];
const $=id=>document.getElementById(id);
let qs=[], qi=0, score=0;
function start(){ qs=PLAN.map(p=>makeQ(...p)); qi=0; score=0; show(); }
function show(){
  $('wqScore').textContent=score; $('wqCount').textContent=qi<qs.length?`Question ${qi+1} of ${qs.length}`:'Finished'; $('wqFill').style.width=(qi/qs.length*100)+'%';
  const card=$('wqCard');
  if(qi>=qs.length){
    card.innerHTML=`<div class="wq-end">You got<b>${score} / ${qs.length}</b><button class="wq-next" id="wqAgain" type="button">Play again with new people</button></div>`;
    $('wqAgain').addEventListener('click',start); return;
  }
  const q=qs[qi];
  card.innerHTML=q.mode==='A'
    ?`<p class="wq-prompt">Choose the correct sentence</p><div class="wq-figure">${HC.render(q.base,{fit:true})}</div>
      <div class="wq-opts">${q.opts.map((o,i)=>`<button class="wq-opt" type="button" data-i="${i}">${o.text}</button>`).join('')}</div>`
    :`<p class="wq-prompt">Choose the correct person</p><p class="wq-sentence">${q.sentence}</p>
      <div class="wq-opts pics">${q.opts.map((o,i)=>`<button class="wq-opt" type="button" data-i="${i}" aria-label="Person ${i+1}">${HC.render(o.p,{fit:true})}</button>`).join('')}</div>`;
  card.insertAdjacentHTML('beforeend','<div class="wq-foot"><span class="wq-fb" id="wqFb" role="status"></span><button class="wq-next" id="wqNext" type="button" hidden>Next →</button></div>');
  card.querySelectorAll('.wq-opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
  $('wqNext').addEventListener('click',()=>{qi++;show();});
}
function answer(i){
  const q=qs[qi], ok=q.opts[i].ok; if(ok) score++;
  document.querySelectorAll('.wq-opt').forEach((b,k)=>{ b.disabled=true; b.classList.add(q.opts[k].ok?'right':k===i?'wrong':'dim'); });
  const fb=$('wqFb'); fb.className='wq-fb '+(ok?'ok':'no');
  fb.textContent=ok?'Correct!':q.mode==='A'?`Not quite. ${q.sentence}`:'Not quite — the correct person is marked in green.';
  $('wqScore').textContent=score; $('wqNext').hidden=false; $('wqNext').textContent=qi===qs.length-1?'See my score':'Next →'; $('wqNext').focus();
}
start();

})();
</script>
</body>
</html>
