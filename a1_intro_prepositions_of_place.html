<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Where Are My Books? — Prepositions of Place</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
.scene{ max-width:560px; margin:0 auto .5rem; }
.scene-caption{ text-align:center; font-size:.8333rem; color:var(--text-secondary); margin:0 0 1.2rem; }
</style>
</head>
<body>
<div class="page" id="page">
  <span class="cefr-tag cefr-a1">A1 · Beginner</span>
  <h1>Where Are My Books?</h1>
  <p class="subtitle">Leo and Ana are in the living room. Leo can't find his books.</p>

  <div class="sec-div">Before you read</div>
  <div id="preQuestions"></div>

  <div class="sec-div">The conversation</div>
  <div class="scene" id="roomPic"></div>
  <p class="scene-caption">Leo and Ana's living room</p>

  <button class="grammar-toggle-btn" id="grammarToggle">🎨 Show Grammar</button>
  <div class="pos-legend"></div>

  <div id="conversation"></div>

  <div class="sec-div">Check your answers</div>
  <div id="quiz"></div>

  <footer>Where Are My Books? — Prepositions of Place (A1)</footer>
</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>
<script src="house-engine.js"></script>
<script>
const it = (type, level, slot) => ({ type, level, slot: slot || 'C', dir: 0 });

/* The room as the conversation ends: the books are under the side table. */
HousePicture.draw('roomPic', HousePicture.room({
  cols: 5, rows: 4, openings: [['h', 0, 3, 'window']],
  furniture: [
    { type: 'bookshelf', x: 1.5, y: 0.5, dir: 2 },
    { type: 'loveseat',  x: 1.5, y: 1.5, dir: 2, items: [it('cushion', 0, 'R')] },
    { type: 'sidetable', x: 2.5, y: 1.5, dir: 2, items: [it('lamp', 0), it('books', 1)] },
    { type: 'armchair',  x: 4, y: 3, dir: 3 },
    { type: 'tvstand',   x: 0.5, y: 2.5, dir: 1, items: [it('tv', 1)] }
  ],
  appliances: [{ type: 'planter', x: 3.5, y: 1.5, dir: 0 }, { type: 'rug', x: 2, y: 3, dir: 0 }]
}), { alt: 'A living room. The books are under the side table, next to the sofa.' });

/* Conversation lines. [words/pos] marks a part of speech for the grammar colours. */
const SPEAKERS = {
  Leo: { avatar: '👨‍🦱', av: 'av-a', side: 'left' },
  Ana: { avatar: '🙋', av: 'av-b', side: 'right' }
};
const LINES = [
  ['Leo', '[Ana/noun], [where/wh] [are/verb] [my books/noun]?'],
  ['Ana', '[Are/verb] [they/subject] [on/prep] [the table/noun]?'],
  ['Leo', '[No/none], [they/subject] [aren’t/neg].'],
  ['Ana', '[Look/verb] [in/prep] [the bookcase/noun].'],
  ['Leo', '[They/subject] [aren’t/neg] [in/prep] [the bookcase/noun].'],
  ['Ana', '[Are/verb] [they/subject] [under/prep] [the sofa/noun]?'],
  ['Leo', '[No/none]… [Oh/none], [here/adverb] [they/subject] [are/verb]! [They’re/subject] [under/prep] [the side table/noun], [next to/prep] [the sofa/noun].'],
  ['Ana', '[Good/adj]! [Now/time], [where’s/wh] [my phone/noun]?'],
  ['Leo', '[Is/verb] [it/subject] [behind/prep] [the cushion/noun]?'],
  ['Ana', '[Yes/none]! [Here/adverb] [it/subject] [is/verb]. [Thanks/none]! [And/conj] [my bag/noun]?'],
  ['Leo', '[It’s/subject] [in front of/prep] [the TV/noun].'],
  ['Ana', '[Great/adj]. [Now/time] [I/subject] [need/verb] [my glasses/noun]. [Where/wh] [are/verb] [they/subject]?'],
  ['Leo', '[Ana/noun]! [They’re/subject] [on/prep] [your head/noun]!'],
  ['Ana', '[Oh/none]! 😄']
];
const conv = document.getElementById('conversation');
LINES.forEach(([who, text]) => {
  const s = SPEAKERS[who], right = s.side === 'right';
  const html = text.replace(/\[([^\/\]]+)\/(\w+)\]/g, '<span class="pos-hl pos-$2">$1</span>');
  conv.insertAdjacentHTML('beforeend',
    '<div class="bubble-wrap' + (right ? ' right' : '') + '">' +
      '<div class="avatar ' + s.av + '">' + s.avatar + '</div>' +
      '<div class="bubble-col"><div class="bname' + (right ? ' right' : '') + '">' + who + '</div>' +
      '<div class="bubble ' + (right ? 'right' : 'left') + '">' + html + '</div></div>' +
    '</div>');
});

const CQ_ITEMS = [
  { q: 'What is Leo looking for?', opts: ['his glasses', 'his books', 'his phone'], correct: 1 },
  { q: 'Where are Leo’s books?', opts: ['in the bookcase', 'on the table', 'under the side table'], correct: 2 },
  { q: 'Where are Ana’s glasses?', opts: ['on her head', 'behind the cushion', 'in front of the TV'], correct: 0 }
];
HouseComprehension.build({ pre: 'preQuestions', quiz: 'quiz', items: CQ_ITEMS });
</script>
<script>HouseGrammar.init();</script>
</body>
</html>
