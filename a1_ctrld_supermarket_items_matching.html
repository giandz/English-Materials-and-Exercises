<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermarket Items — Matching</title>
<link rel="stylesheet" href="general.css">
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f6f7f9;
    --color-text-primary: #1a1d23;
    --color-text-secondary: #4b5261;
    --color-text-tertiary: #8a8f9c;
    --color-border-secondary: #e2e5ea;
    --border-radius-lg: 14px;

    --text-primary: var(--color-text-primary);
    --text-secondary: var(--color-text-secondary);
    --text-muted: var(--color-text-tertiary);
    --surface-1: var(--color-background-primary);
    --surface-2: var(--color-background-secondary);
    --border: var(--color-border-secondary);
    --radius: var(--border-radius-lg);

    --pos-yes: #1a7f37;
    --pos-no: #c03434;           --pos-no-bg: #fbe7e7;

    --cat-dairy: #1d6fd8;        --cat-dairy-bg: #e3edfd;
    --cat-produce: #1a7f37;      --cat-produce-bg: #e6f6ea;
    --cat-meat: #c0355e;         --cat-meat-bg: #fbe6ee;
    --cat-bakery: #b3690a;       --cat-bakery-bg: #fdf1e0;
    --cat-pantry: #7a3fc0;       --cat-pantry-bg: #f2e9fb;
    --cat-frozen: #0891b2;       --cat-frozen-bg: #cffafe;
    --cat-beverages: #c03a7a;    --cat-beverages-bg: #fbe6f1;
    --cat-household: #5c6270;    --cat-household-bg: #e7e8eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #16181d;
      --color-background-secondary: #1d2026;
      --color-text-primary: #eef0f3;
      --color-text-secondary: #b7bcc6;
      --color-text-tertiary: #838995;
      --color-border-secondary: #2c303a;

      --surface-1: var(--color-background-primary);
      --surface-2: var(--color-background-secondary);
      --border: var(--color-border-secondary);

      --pos-yes: #6fd08c;
      --pos-no: #f08a8a;           --pos-no-bg: #3a1c1c;

      --cat-dairy: #7cb0f7;        --cat-dairy-bg: #1c2b42;
      --cat-produce: #6fd08c;      --cat-produce-bg: #163524;
      --cat-meat: #ec7fa3;         --cat-meat-bg: #3a1c28;
      --cat-bakery: #e3a655;       --cat-bakery-bg: #3a2c14;
      --cat-pantry: #b98af0;       --cat-pantry-bg: #2c2140;
      --cat-frozen: #4fd3e8;       --cat-frozen-bg: #123a42;
      --cat-beverages: #ec86bb;    --cat-beverages-bg: #3a1f2c;
      --cat-household: #a3a8b4;    --cat-household-bg: #2a2d34;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    background: var(--surface-1);
    margin: 0;
    line-height: 1.55;
  }
  .page { max-width: 820px; margin: 0 auto; padding: 28px 20px 0; }

  h1 { font-size: 1.3rem; margin: 4px 0 2px; }
  .subtitle { color: var(--text-secondary); margin: 0 0 14px; font-size: 0.95rem; }

  .score-bar-wrap { display: flex; align-items: center; gap: 12px; margin: 10px 0 18px; }
  .score-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .score-fill { height: 100%; width: 0%; background: var(--pos-yes); transition: width .3s; }
  .score-label { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }

  .bin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    padding-bottom: 24px;
  }
  .bin {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    background: var(--surface-2);
    min-height: 110px;
  }
  .bin-label { font-size: 0.9rem; font-weight: 700; margin: 0 0 2px; }
  .bin-def { font-size: 0.78rem; color: var(--text-muted); margin: 0 0 10px; }
  .bin-drop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }

  .food-chip {
    touch-action: none;
    user-select: none;
    cursor: grab;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .food-chip.dragging { cursor: grabbing; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 1000; }
  .food-chip.shake {
    animation: shakeX .4s ease;
    background: var(--pos-no-bg);
    color: var(--pos-no);
    border-color: var(--pos-no);
  }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .food-chip.placed { cursor: default; animation: placePulse .3s ease; }
  @keyframes placePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .pool-sticky {
    position: sticky;
    bottom: 0;
    background: var(--surface-1);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 16px rgba(0,0,0,0.06);
    padding: 12px 20px 16px;
    margin: 0 -20px;
  }
  .pool-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .pool-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .chip-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 150px;
    overflow-y: auto;
    padding: 4px 2px;
  }
</style>
</head>
<body>
<div class="page">

  <h1>Supermarket Items — Matching</h1>
  <p class="subtitle">Drag each word into the category it belongs to.</p>

  <div class="score-bar-wrap">
    <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
    <div class="score-label"><span id="scoreCount">0</span>/<span id="scoreTotal">0</span> correct</div>
  </div>

  <div class="bin-grid" id="bins"></div>

</div>

<div class="pool-sticky">
  <div class="pool-header"><span class="pool-title">Word Bank</span></div>
  <div class="chip-pool" id="pool"></div>
</div>

<div id="theme-toggle-wrap"><button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"><span id="theme-icon">☀️</span></button></div>
<script src="theme-toggle-behavior.js"></script>

<script>
const data = [
  { category: "dairy", label: "Dairy & Eggs", def: "Food made from milk, and eggs from chickens.", color: "var(--cat-dairy)", bg: "var(--cat-dairy-bg)",
    items: ["Milk", "Eggs", "Cheese", "Butter", "Yogurt", "Sour cream"] },
  { category: "produce", label: "Produce", def: "Fresh fruits and vegetables.", color: "var(--cat-produce)", bg: "var(--cat-produce-bg)",
    items: ["Bananas", "Apples", "Potatoes", "Onions", "Tomatoes", "Lettuce", "Carrots", "Avocados", "Oranges", "Grapes"] },
  { category: "meat", label: "Meat & Poultry", def: "Meat from animals like cows, pigs, and chickens.", color: "var(--cat-meat)", bg: "var(--cat-meat-bg)",
    items: ["Chicken breast", "Ground beef", "Bacon", "Pork chops", "Turkey", "Sausage"] },
  { category: "bakery", label: "Bakery", def: "Bread and other food made in an oven.", color: "var(--cat-bakery)", bg: "var(--cat-bakery-bg)",
    items: ["Bread", "Bagels", "Tortillas", "Dinner rolls"] },
  { category: "pantry", label: "Pantry", def: "Dry or canned food you keep in a cupboard.", color: "var(--cat-pantry)", bg: "var(--cat-pantry-bg)",
    items: ["Rice", "Pasta", "Canned soup", "Peanut butter", "Cereal", "Flour", "Sugar", "Olive oil", "Canned beans", "Ketchup"] },
  { category: "frozen", label: "Frozen", def: "Food kept very cold in a freezer.", color: "var(--cat-frozen)", bg: "var(--cat-frozen-bg)",
    items: ["Frozen pizza", "Ice cream", "Frozen vegetables", "Frozen chicken nuggets"] },
  { category: "beverages", label: "Beverages", def: "Drinks, like water, juice, or coffee.", color: "var(--cat-beverages)", bg: "var(--cat-beverages-bg)",
    items: ["Bottled water", "Coffee", "Orange juice", "Soda", "Tea", "Beer"] },
  { category: "household", label: "Household & Personal Care", def: "Things you use to clean your home or your body.", color: "var(--cat-household)", bg: "var(--cat-household-bg)",
    items: ["Paper towels", "Toilet paper", "Dish soap", "Laundry detergent"] }
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const binsEl = document.getElementById("bins");
const poolEl = document.getElementById("pool");
const scoreFillEl = document.getElementById("scoreFill");
const scoreCountEl = document.getElementById("scoreCount");
const scoreTotalEl = document.getElementById("scoreTotal");

let total = 0;
let correct = 0;
const allChips = [];

data.forEach((group) => {
  const bin = document.createElement("div");
  bin.className = "bin";
  bin.dataset.category = group.category;
  bin.innerHTML = `
    <p class="bin-label" style="color:${group.color}">${group.label}</p>
    <p class="bin-def">${group.def}</p>
    <div class="bin-drop"></div>
  `;
  binsEl.appendChild(bin);

  group.items.forEach((name) => {
    total++;
    allChips.push({ name, category: group.category, color: group.color, bg: group.bg });
  });
});
scoreTotalEl.textContent = total;

function updateScore() {
  scoreCountEl.textContent = correct;
  scoreFillEl.style.width = (correct / total * 100) + "%";
}

function makeDraggable(chip) {
  chip.addEventListener("pointerdown", (e) => {
    if (chip.dataset.placed) return;
    chip.setPointerCapture(e.pointerId);
    chip.classList.add("dragging");
    const startParent = chip.parentElement;
    const move = (ev) => {
      chip.style.position = "fixed";
      chip.style.left = (ev.clientX - 30) + "px";
      chip.style.top = (ev.clientY - 16) + "px";
    };
    const up = (ev) => {
      chip.classList.remove("dragging");
      chip.style.position = "";
      chip.style.left = "";
      chip.style.top = "";
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
      const bin = dropEl && dropEl.closest(".bin");
      if (bin && bin.dataset.category === chip.dataset.category) {
        bin.querySelector(".bin-drop").appendChild(chip);
        chip.style.background = chip.dataset.bg;
        chip.style.color = chip.dataset.color;
        chip.style.borderColor = chip.dataset.color;
        chip.classList.add("placed");
        chip.dataset.placed = "1";
        correct++;
        updateScore();
      } else if (bin) {
        chip.classList.add("shake");
        setTimeout(() => chip.classList.remove("shake"), 400);
        poolEl.appendChild(chip);
      } else {
        startParent.appendChild(chip);
      }
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

shuffle(allChips).forEach((it) => {
  const chip = document.createElement("span");
  chip.className = "food-chip";
  chip.textContent = it.name;
  chip.dataset.category = it.category;
  chip.dataset.color = it.color;
  chip.dataset.bg = it.bg;
  makeDraggable(chip);
  poolEl.appendChild(chip);
});

updateScore();
</script>
</body>
</html>
