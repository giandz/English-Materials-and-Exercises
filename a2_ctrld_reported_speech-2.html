<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reported Speech — Gap Fill</title>
<script>
// Applies the saved/system theme to <html> as early as possible, before the
// stylesheet below paints anything, so there's no flash of the wrong theme.
// Self-contained: no dependency on any external script.
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    // Same idea for the text size: apply it before house.css paints, so a
    // person who chose 28px doesn't watch the page reflow from 14px on load.
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28){
      document.documentElement.style.setProperty('--fs-base', fs + 'px');
    }
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
/* Recovered page-specific rules. */
button.main, button.secondary{
    font-family:inherit;
    padding:9px 18px;
    border:none;
    border-radius:100px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
button.main{ background:var(--text-accent); color:#fff; }
button.secondary{
    background:var(--surface-1);
    color:var(--text-secondary);
    border:.5px solid var(--border);
  }

h1{
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }

  /* Answer pool */
  .pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    min-height:48px;
    padding:14px;
    background:var(--surface-1);
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    margin-bottom:1.5rem;
    position: sticky;
    top: 0px;
  }
  .choice{
    padding:7px 14px;
    border:.5px solid var(--border);
    border-radius:999px;
    background:var(--surface-2);
    cursor:grab;
    user-select:none;
    font-size:0.8667rem;
    font-weight:600;
    color:var(--text-primary);
  }
  .choice.used{
    opacity:0.3;
    pointer-events:none;
  }

  /* Gap-fill items */
  .gf-item{
    border:.5px solid var(--color-border-tertiary);
    border-radius:var(--border-radius-lg);
    padding:13px 15px;
    margin-bottom:10px;
    background:var(--surface-2);
  }
  .gf-sentence{
    font-size:0.9333rem;
    margin-bottom:9px;
  }
  .gf-feedback{
    font-size:0.8rem;
    font-weight:600;
    margin-top:7px;
    min-height:16px;
  }
  .gf-feedback.correct{ color:var(--good); }
  .gf-feedback.wrong{ color:var(--bad); }

  .button-row{
    margin-top:1.25rem;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .overall{
    margin-top:14px;
    font-weight:600;
    font-size:0.9rem;
    min-height:20px;
  }
  .overall.correct{ color:var(--good); }
  .overall.wrong{ color:var(--bad); }

  footer{ text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:2rem; }
</style>
</head>
<body>
<div class="page" id="page">

  <span class="cefr-tag cefr-a2">A2 · Grammar Practice</span>
  <h1>Reported Speech — Gap Fill</h1>
  <p class="subtitle">Drag a word from the pool into the correct blank, then check your answers.</p>

  <div class="rule-box">
    <strong>Tip:</strong> when the reporting verb is in the past (<em>said</em>), the verb inside usually shifts one tense back.
  </div>

  <div class="sec-div">Answer pool</div>
  <div id="pool" class="pool"></div>

  <div class="sec-div">Sentences</div>
  <div id="quiz"></div>

  <div class="button-row">
    <button class="main" onclick="checkAll()">Check all</button>
    <button class="secondary" onclick="resetAll()">Reset</button>
  </div>

  <div id="overallFeedback" class="overall"></div>

  <footer>Grammar Practice — Reported Speech</footer>
</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>
<script>
const items = [
    { text: "She said that she ___ tired.", answer: "was" },
    { text: "He said that he ___ to the party.", answer: "had been" },
    { text: "They said that they ___ English.", answer: "had been studying" },
    { text: "Mary said that she ___ her homework.", answer: "had finished" },
    { text: "Tom said that he ___ a hurry.", answer: "was in" },
    { text: "Anna said that she ___ a new bike.", answer: "had bought" },
    { text: "He said that he ___ the answer.", answer: "knew" },
    { text: "Lucy said that she ___ her friend.", answer: "had called" },
    { text: "The teacher said that the lesson ___.", answer: "had started" },
    { text: "We said that we ___ happy.", answer: "were" }
  ];

  const answerPool = ["was", "had been", "was in", "went", "had been studying", "had finished", "had bought", "knew", "had called", "had started"];

  function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function renderPool() {
    const pool = document.getElementById("pool");
    pool.innerHTML = "";
    shuffle(answerPool).forEach(word => {
      const span = document.createElement("span");
      span.className = "choice";
      span.draggable = true;
      span.textContent = word;
      span.id = "choice-" + word.replace(/\s+/g, "-");

      span.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", word);
      });

      pool.appendChild(span);
    });
  }

  function renderQuiz() {
    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";
    items.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "gf-item";
      div.innerHTML = `
        <div class="gf-sentence">${index + 1}. ${item.text}</div>
        <input type="text" id="input-${index}" placeholder="Drop or type" />
        <div class="gf-feedback" id="feedback-${index}"></div>
      `;

      const input = div.querySelector(`#input-${index}`);
      input.addEventListener("dragover", e => e.preventDefault());
      input.addEventListener("drop", e => {
        e.preventDefault();
        const word = e.dataTransfer.getData("text/plain");
        input.value = word;
        const choice = document.querySelectorAll(".choice");
        choice.forEach(c => {
          if (c.textContent === word && !c.classList.contains("used")) {
            c.classList.add("used");
          }
        });
      });

      quiz.appendChild(div);
    });
  }

  function checkAll() {
    let correct = 0;
    items.forEach((item, index) => {
      const input = document.getElementById(`input-${index}`);
      const fb = document.getElementById(`feedback-${index}`);
      const value = input.value.trim().toLowerCase();
      if (value === item.answer.toLowerCase()) {
        fb.textContent = "Correct!";
        fb.className = "gf-feedback correct";
        correct++;
      } else {
        fb.textContent = "Try again.";
        fb.className = "gf-feedback wrong";
      }
    });
    const overall = document.getElementById("overallFeedback");
    overall.textContent = `${correct}/${items.length} correct.`;
    overall.className = correct === items.length ? "overall correct" : "overall wrong";
  }

  function resetAll() {
    document.querySelectorAll("input").forEach(input => input.value = "");
    document.querySelectorAll(".gf-feedback").forEach(fb => {
      fb.textContent = "";
      fb.className = "gf-feedback";
    });
    document.getElementById("overallFeedback").textContent = "";
    document.getElementById("overallFeedback").className = "overall";
    renderPool();
  }

  renderPool();
  renderQuiz();
</script>
</body>
</html>
