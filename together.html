<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ICwhatUC's session page. It holds the connection and shows the lesson pages in a
     frame that fills the window, so the connection stays open from one lesson page to
     the next. A tab comes here by itself when someone presses Start or Join on a
     lesson; opened with no session, it opens the lesson on its own.
     Keep it next to house.js and icwhatuc.js. -->
<title>Lesson</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme-preference');
    var dark = saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.background = dark ? '#1e1e20' : '#ffffff';
  } catch (e) { /* the lesson paints its own background */ }
})();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #icw-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  #icw-shell-note { position: fixed; left: 0; right: 0; bottom: 14px; margin: 0 auto; width: max-content; max-width: calc(100vw - 20px); z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 14px; background: #fff; color: #1a1a1a;
    border: 1px solid #185fa5; box-shadow: 0 8px 24px rgba(0,0,0,.2); font: 600 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #icw-shell-note[hidden] { display: none; }
  #icw-shell-note button { font: inherit; padding: 7px 12px; border-radius: 999px; border: 1px solid #185fa5; background: #185fa5; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<iframe id="icw-frame" title="Lesson" allow="clipboard-write; autoplay; fullscreen; speaker-selection"></iframe>
<script>window.ICWHATUC_SHELL = true;</script>
<script src="icwhatuc.js"></script>
</body>
</html>
