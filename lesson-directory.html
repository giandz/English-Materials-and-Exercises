<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson Directory</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme-preference');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var fs = parseFloat(localStorage.getItem('font-size-preference'));
    if (fs >= 10 && fs <= 28) document.documentElement.style.setProperty('--fs-base', fs + 'px');
  }catch(e){ /* localStorage/matchMedia unavailable — CSS media query still applies */ }
})();
</script>
<link rel="stylesheet" href="house.css">
<style>
[hidden]{ display:none !important; }

/* Keep the heading clear of the fixed ☀️ / 🔎 buttons on narrow screens. */
@media (max-width:820px){ .dir-head{ padding-right:46px; } }

/* ── Toolbar ─────────────────────────────────────────────────────────────── */
.dir-toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 .7rem; }
.dir-toolbar input[type="search"]{ flex:1 1 14rem; min-width:0; }
.dir-toolbar button:disabled{ opacity:.45; cursor:default; transform:none; }
.dir-toolbar button:disabled:hover{ background:var(--surface-1); }
.dir-count{ font-size:.8rem; color:var(--text-muted); white-space:nowrap; margin-left:auto; }

/* ── Notes ───────────────────────────────────────────────────────────────── */
.dir-note{
  font-size:.8667rem; line-height:1.5; padding:9px 12px; margin:0 0 .7rem;
  border:1px solid; border-radius:var(--border-radius-md);
}
.dir-note.warn{ background:var(--color-background-warning); color:var(--color-text-warning); border-color:var(--color-border-warning); }
.dir-note.error{ background:var(--color-background-danger); color:var(--color-text-danger); border-color:var(--color-border-danger); }
.dir-source{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--text-muted); margin:0 0 .7rem; }
.dir-fallback p{ margin:0 0 .6rem; }

/* ── Table ───────────────────────────────────────────────────────────────── */
.dir-table-wrap{
  overflow-x:auto; background:var(--surface-2);
  border:1px solid var(--border); border-radius:var(--border-radius-lg);
}
.dir-table{ width:100%; border-collapse:collapse; font-size:.9333rem; }
.dir-table th{
  text-align:left; font-size:.8rem; font-weight:600; color:var(--text-secondary);
  background:var(--surface-1); padding:8px 10px; white-space:nowrap;
}
.dir-table thead tr:last-child th{ border-bottom:1px solid var(--border); }
.dir-table th[data-col]{ cursor:pointer; user-select:none; }
.dir-table th[data-col]:hover{ color:var(--text-primary); }
.dir-table th[data-col]:focus-visible{ outline:2px solid var(--text-accent); outline-offset:-2px; }
.dir-table .sort-arrow{ display:inline-block; width:1em; font-size:.7333rem; color:var(--text-accent); }
.dir-filters th{ padding:0 10px 8px; font-weight:400; }
.dir-filters select,
.dir-filters input[type="search"]{
  width:100%; font:inherit; font-size:.8rem; padding:4px 8px;
  border:1px solid var(--color-border-secondary); border-radius:var(--border-radius-md);
  background:var(--color-background-primary); color:var(--text-primary);
}
.dir-filters select{ cursor:pointer; }
.dir-filters select:focus{ outline:none; border-color:var(--text-accent); }

.dir-table td{ padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.dir-table tbody tr:last-child td{ border-bottom:none; }
.dir-table tbody tr:hover td{ background:var(--surface-1); }
.dir-table tbody tr.is-selected td{ background:var(--color-background-info); }
.dir-table .sel-col{ width:1%; padding-right:2px; }
.dir-table input[type="checkbox"]{ width:1rem; height:1rem; margin:0; cursor:pointer; accent-color:var(--text-accent); vertical-align:middle; }
.dir-table .cefr-tag{ margin:0; white-space:nowrap; }
.dir-table .type-cell{ color:var(--text-secondary); white-space:nowrap; }
.dir-table .topic-cell a{ color:var(--text-accent); text-decoration:none; font-weight:500; }
.dir-table .topic-cell a:hover{ text-decoration:underline; }
.dir-empty td{ text-align:center; color:var(--text-muted); padding:18px 10px; }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="dir-head">
  <h1>Lesson Directory</h1>
  <p class="subtitle">Every lesson in this folder. Tick lessons to open them together.</p>

  <div id="status-box" class="rule-box">Loading lesson files…</div>
  <div id="error-box" class="dir-note error" hidden></div>

  <div id="local-fallback" class="rule-box dir-fallback" hidden>
    <p id="local-fallback-msg"></p>
    <button id="folder-picker-btn" type="button">📁 Choose folder…</button>
    <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
  </div>

  <div id="source-note" class="dir-source" hidden>
    <span id="source-label"></span>
    <button id="switch-source-btn" type="button"></button>
  </div>
  </div>

  <div id="directory" hidden>
    <div class="dir-toolbar">
      <input type="search" id="filter-input" placeholder="Search level, type or topic…" aria-label="Search all columns">
      <button id="open-all-btn" type="button" disabled>↗️ Open all</button>
      <button id="filter-by-btn" type="button" disabled>🔍 Filter by</button>
      <span class="dir-count" id="count-label"></span>
    </div>

    <p id="popup-note" class="dir-note warn" hidden></p>

    <div class="dir-table-wrap">
      <table class="dir-table">
        <thead>
          <tr class="header-row">
            <th class="sel-col"><input type="checkbox" id="select-all" aria-label="Select all shown lessons"></th>
            <th data-col="level" tabindex="0">Level <span class="sort-arrow"></span></th>
            <th data-col="type" tabindex="0">Type <span class="sort-arrow"></span></th>
            <th data-col="topic" tabindex="0">Topic <span class="sort-arrow"></span></th>
          </tr>
          <tr class="dir-filters">
            <th class="sel-col"></th>
            <th>
              <select id="level-filter" aria-label="Filter by level">
                <option value="">All levels</option>
                <option value="a1">A1</option>
                <option value="a2">A2</option>
                <option value="b1">B1</option>
                <option value="b2">B2</option>
                <option value="c1">C1</option>
                <option value="c2">C2</option>
              </select>
            </th>
            <th>
              <select id="type-filter" aria-label="Filter by type">
                <option value="">All types</option>
                <option value="intro">Language Introduction</option>
                <option value="clarf">Clarification</option>
                <option value="ctrld">Controlled Practice</option>
                <option value="freer">Freer Practice</option>
                <option value="extra">Extra Activity</option>
              </select>
            </th>
            <th><input type="search" id="topic-filter" placeholder="Topic…" aria-label="Filter by topic"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="theme-toggle-wrap">
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
    <span id="theme-icon">☀️</span>
  </button>
</div>
<script src="house.js"></script>
<script>
  const TYPE_LABELS = {
    intro: 'Language Introduction',
    clarf: 'Clarification',
    ctrld: 'Controlled Practice',
    freer: 'Freer Practice',
    extra: 'Extra Activity'
  };
  // Pedagogical order, used whenever the Type column is compared.
  const TYPE_ORDER = ['intro', 'clarf', 'ctrld', 'freer', 'extra'];
  const LEVEL_TOKEN = 'a1|a2|b1|b2|c1|c2';
  const FILE_PATTERN = new RegExp(
    `^((?:${LEVEL_TOKEN}){1,2})_(intro|clarf|ctrld|freer|extra)_(.+)\\.html$`, 'i'
  );

  const $ = id => document.getElementById(id);
  const statusBox = $('status-box');
  const errorBox = $('error-box');
  const localFallback = $('local-fallback');
  const folderPickerBtn = $('folder-picker-btn');
  const folderInput = $('folder-input');
  const sourceNote = $('source-note');
  const sourceLabel = $('source-label');
  const switchSourceBtn = $('switch-source-btn');
  const directory = $('directory');
  const tableBody = $('table-body');
  const filterInput = $('filter-input');
  const levelFilter = $('level-filter');
  const typeFilter = $('type-filter');
  const topicFilter = $('topic-filter');
  const countLabel = $('count-label');
  const selectAllCheckbox = $('select-all');
  const openAllBtn = $('open-all-btn');
  const filterByBtn = $('filter-by-btn');
  const popupNote = $('popup-note');

  let rows = [];
  let rowsById = new Map();
  let lastFiltered = [];
  let selectedIds = new Set();
  let sortCol = 'level';
  let sortDir = 'asc';
  let nextRowId = 1;
  let onSwitchSource = null;

  const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Same conversion as the GitHub → GitHub Pages link converter:
  // github.com/<user>/<repo>/blob/<branch>/<path> → <user>.github.io/<repo>/<path>
  function convertToPagesUrl(blobUrl) {
    const match = blobUrl.match(
      /^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/
    );
    if (!match) return null;
    const [, user, repo, , path] = match;
    return `https://${user}.github.io/${repo}/${path}`;
  }

  function normaliseTopic(slug) {
    return slug
      .split('_')
      .filter(Boolean)
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  }

  function parseFileNameParts(fileName) {
    const match = fileName.match(FILE_PATTERN);
    if (!match) return null;
    const [, levelGroup, type, topicSlug] = match;
    const level = levelGroup.toLowerCase();
    const levels = level.match(new RegExp(LEVEL_TOKEN, 'g'));
    return {
      level,
      levels,
      levelLabel: levels.map(l => l.toUpperCase()).join('/'),
      type: type.toLowerCase(),
      typeLabel: TYPE_LABELS[type.toLowerCase()],
      topic: normaliseTopic(topicSlug)
    };
  }

  function buildRow(fileName, url) {
    const parts = parseFileNameParts(fileName);
    if (!parts || !url) return null;
    return { ...parts, url, fileName, id: nextRowId++ };
  }

  /* ── GitHub source ─────────────────────────────────────────────────────── */
  async function fetchContents(owner, repo, dirPath) {
    const apiPath = dirPath ? `/${dirPath}` : '';
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents${apiPath}`);
    if (!res.ok) throw new Error(`GitHub API responded with ${res.status}`);
    return res.json();
  }

  async function loadDirectory() {
    if (location.protocol === 'file:') {
      throw new Error('page opened as a local file, no GitHub host to query');
    }
    const owner = location.hostname.split('.')[0];
    const pathParts = location.pathname.split('/').filter(Boolean);

    const attempts = [];
    if (pathParts.length > 0) {
      // Project page: owner.github.io/repo/.../this-file.html
      attempts.push({ repo: pathParts[0], dir: pathParts.slice(1, -1).join('/') });
    }
    // User/org root page: owner.github.io/.../this-file.html
    attempts.push({ repo: `${owner}.github.io`, dir: pathParts.slice(0, -1).join('/') });

    let items = null;
    let lastError = null;
    for (const attempt of attempts) {
      try {
        items = await fetchContents(owner, attempt.repo, attempt.dir);
        break;
      } catch (e) {
        lastError = e;
      }
    }
    if (!items) throw lastError || new Error('Could not locate this repository.');

    return items
      .filter(item => item.type === 'file' && /\.html?$/i.test(item.name))
      .map(item => buildRow(item.name, convertToPagesUrl(item.html_url)))
      .filter(Boolean);
  }

  /* ── Local folder source ───────────────────────────────────────────────── */
  function isRelativeUrl(url) {
    return !/^[a-z][a-z0-9+.-]*:/i.test(url) && !url.startsWith('//');
  }

  // Only needed when the picked folder is NOT the one this page lives in:
  // a blob: page has no folder, so its relative house.css / house.js links are
  // inlined from the picked files. Anything house.js loads on its own later
  // (pron-adapter.js, vn-adapter.js, favicons) still can't be found that way.
  async function inlineLocalAssets(htmlText, fileMap) {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');

    for (const link of Array.from(doc.querySelectorAll('link[rel="stylesheet"][href]'))) {
      const href = link.getAttribute('href');
      if (!isRelativeUrl(href)) continue;
      const assetFile = fileMap.get(href.split('/').pop().toLowerCase());
      if (!assetFile) continue;
      const style = doc.createElement('style');
      style.textContent = await assetFile.text();
      link.replaceWith(style);
    }

    for (const script of Array.from(doc.querySelectorAll('script[src]'))) {
      const src = script.getAttribute('src');
      if (!isRelativeUrl(src)) continue;
      const assetFile = fileMap.get(src.split('/').pop().toLowerCase());
      if (!assetFile) continue;
      const inlined = doc.createElement('script');
      inlined.textContent = await assetFile.text();
      script.replaceWith(inlined);
    }

    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  // The folder this directory page itself sits in, e.g. "lessons".
  function ownFolderName() {
    const parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
    return parts.length >= 2 ? parts[parts.length - 2] : '';
  }

  async function loadLocalFolder(fileList) {
    const files = Array.from(fileList);
    // Top-level files only, to match the GitHub listing of a single folder.
    const topLevel = files.filter(f => (f.webkitRelativePath || f.name).split('/').length <= 2);
    const pickedFolder = (files[0] && files[0].webkitRelativePath)
      ? files[0].webkitRelativePath.split('/')[0] : '';
    // If the picked folder is the one this page lives in, plain relative links
    // open the real files, so every asset (house.js add-ons included) loads.
    const sameFolder = pickedFolder && pickedFolder === ownFolderName();

    const fileMap = new Map(topLevel.map(f => [f.name.toLowerCase(), f]));
    const parsed = [];
    for (const f of topLevel) {
      if (!parseFileNameParts(f.name)) continue;
      let url;
      if (sameFolder) {
        url = encodeURIComponent(f.name);
      } else {
        const html = await inlineLocalAssets(await f.text(), fileMap);
        url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      }
      parsed.push(buildRow(f.name, url));
    }
    return parsed;
  }

  /* ── Sorting & filtering ───────────────────────────────────────────────── */
  const COMPARE = {
    level: (a, b) => a.level.localeCompare(b.level),
    type:  (a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type),
    topic: (a, b) => a.topic.localeCompare(b.topic)
  };
  // Tie-breakers keep each lesson set together and in teaching order
  // (intro → clarf → ctrld → freer → extra) whatever column is sorted.
  const TIE_BREAKERS = {
    level: ['topic', 'type'],
    type:  ['level', 'topic'],
    topic: ['level', 'type']
  };

  function compareRows(a, b) {
    if (!COMPARE[sortCol]) return 0;
    const primary = COMPARE[sortCol](a, b);
    if (primary !== 0) return sortDir === 'asc' ? primary : -primary;
    for (const key of TIE_BREAKERS[sortCol]) {
      const cmp = COMPARE[key](a, b);
      if (cmp !== 0) return cmp;
    }
    return 0;
  }

  function render() {
    const query = filterInput.value.trim().toLowerCase();
    const levelValue = levelFilter.value;
    const typeValue = typeFilter.value;
    const topicQuery = topicFilter.value.trim().toLowerCase();

    const filtered = rows.filter(r => {
      if (levelValue && !r.levels.includes(levelValue)) return false;
      if (typeValue && r.type !== typeValue) return false;
      if (topicQuery && !r.topic.toLowerCase().includes(topicQuery)) return false;
      if (query &&
          !(r.level.includes(query) ||
            r.levelLabel.toLowerCase().includes(query) ||
            r.typeLabel.toLowerCase().includes(query) ||
            r.topic.toLowerCase().includes(query))
      ) return false;
      return true;
    });

    filtered.sort(compareRows);
    lastFiltered = filtered;

    tableBody.innerHTML = filtered.length
      ? filtered.map(r => {
          const sel = selectedIds.has(r.id);
          return `
          <tr class="${sel ? 'is-selected' : ''}">
            <td class="sel-col"><input type="checkbox" class="row-select" data-id="${r.id}" aria-label="Select ${escapeHtml(r.topic)}" ${sel ? 'checked' : ''}></td>
            <td><span class="cefr-tag cefr-${r.level}">${r.levelLabel}</span></td>
            <td class="type-cell">${r.typeLabel}</td>
            <td class="topic-cell"><a href="${escapeHtml(r.url)}" target="_blank">${escapeHtml(r.topic)}</a></td>
          </tr>`;
        }).join('')
      : '<tr class="dir-empty"><td colspan="4">No lessons match these filters.</td></tr>';

    countLabel.textContent = `${filtered.length} of ${rows.length} lessons`;

    document.querySelectorAll('.header-row th[data-col]').forEach(th => {
      const active = th.dataset.col === sortCol;
      th.setAttribute('aria-sort', active ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
      th.querySelector('.sort-arrow').textContent = active ? (sortDir === 'asc' ? '▲' : '▼') : '';
    });

    updateSelectionUI();
  }

  function updateSelectionUI() {
    openAllBtn.disabled = selectedIds.size === 0;
    openAllBtn.textContent = selectedIds.size > 1 ? `↗️ Open all (${selectedIds.size})` : '↗️ Open all';
    filterByBtn.disabled = selectedIds.size !== 1;

    const selectedVisible = lastFiltered.filter(r => selectedIds.has(r.id)).length;
    selectAllCheckbox.checked = lastFiltered.length > 0 && selectedVisible === lastFiltered.length;
    selectAllCheckbox.indeterminate = selectedVisible > 0 && selectedVisible < lastFiltered.length;
  }

  /* ── Events ────────────────────────────────────────────────────────────── */
  function sortBy(col) {
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = 'asc';
    }
    render();
  }

  document.querySelectorAll('.header-row th[data-col]').forEach(th => {
    th.addEventListener('click', () => sortBy(th.dataset.col));
    th.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(th.dataset.col); }
    });
  });

  tableBody.addEventListener('change', e => {
    if (!e.target.matches('.row-select')) return;
    const id = Number(e.target.dataset.id);
    if (e.target.checked) selectedIds.add(id);
    else selectedIds.delete(id);
    e.target.closest('tr').classList.toggle('is-selected', e.target.checked);
    updateSelectionUI();
  });

  selectAllCheckbox.addEventListener('change', () => {
    lastFiltered.forEach(r => selectAllCheckbox.checked ? selectedIds.add(r.id) : selectedIds.delete(r.id));
    render();
  });

  openAllBtn.addEventListener('click', () => {
    popupNote.hidden = true;
    let blocked = 0;
    selectedIds.forEach(id => {
      const row = rowsById.get(id);
      if (!row) return;
      // No 'noopener' here: with it, window.open always returns null and a
      // blocked tab can't be told apart from an opened one.
      const win = window.open(row.url, '_blank');
      if (win) {
        try { win.opener = null; } catch (e) { /* ignore */ }
      } else {
        blocked++;
      }
    });
    if (blocked > 0) {
      popupNote.textContent = `Your browser blocked ${blocked} of ${selectedIds.size} tabs. Allow pop-ups for this site (look for the icon in the address bar), then press "Open all" again.`;
      popupNote.hidden = false;
    }
  });

  filterByBtn.addEventListener('click', () => {
    if (selectedIds.size !== 1) return;
    const row = rowsById.get(Array.from(selectedIds)[0]);
    if (!row) return;
    topicFilter.value = row.topic;
    filterInput.value = '';
    render();
  });

  // The two text filters clear each other, so only one is ever active.
  filterInput.addEventListener('input', () => {
    if (filterInput.value) topicFilter.value = '';
    render();
  });
  topicFilter.addEventListener('input', () => {
    if (topicFilter.value) filterInput.value = '';
    render();
  });
  levelFilter.addEventListener('change', render);
  typeFilter.addEventListener('change', render);

  switchSourceBtn.addEventListener('click', () => onSwitchSource && onSwitchSource());

  /* ── Loading ───────────────────────────────────────────────────────────── */
  function showLoaded(parsed, label, switchLabel, onSwitch) {
    rows = parsed;
    rowsById = new Map(rows.map(r => [r.id, r]));
    selectedIds = new Set();
    statusBox.hidden = true;
    localFallback.hidden = true;
    popupNote.hidden = true;

    if (rows.length === 0) {
      errorBox.textContent = 'No lesson files with a level_type_topic.html name were found in this folder.';
      errorBox.hidden = false;
      directory.hidden = true;
    } else {
      errorBox.hidden = true;
      directory.hidden = false;
      render();
    }

    sourceLabel.textContent = label;
    switchSourceBtn.textContent = switchLabel;
    onSwitchSource = onSwitch;
    sourceNote.hidden = false;
  }

  function offerLocalFallback(message) {
    statusBox.hidden = true;
    errorBox.hidden = true;
    directory.hidden = true;
    sourceNote.hidden = true;
    $('local-fallback-msg').textContent = message;
    localFallback.hidden = false;
  }

  folderPickerBtn.addEventListener('click', () => folderInput.click());

  folderInput.addEventListener('change', async () => {
    if (!folderInput.files.length) return;
    localFallback.hidden = true;
    statusBox.textContent = 'Reading the folder…';
    statusBox.hidden = false;
    const parsed = await loadLocalFolder(folderInput.files);
    folderInput.value = '';
    showLoaded(parsed, `${parsed.length} lessons from a folder on this computer.`, '☁️ Try GitHub again', loadFromGitHub);
  });

  function loadFromGitHub() {
    statusBox.textContent = 'Loading lesson files…';
    statusBox.hidden = false;
    errorBox.hidden = true;
    localFallback.hidden = true;
    sourceNote.hidden = true;

    loadDirectory()
      .then(parsed => {
        showLoaded(parsed, `${parsed.length} lessons from GitHub.`, '📁 Use a local folder',
          () => offerLocalFallback('Choose the folder that has the lesson files.'));
      })
      .catch(() => {
        offerLocalFallback("Couldn't get the file list from GitHub. Choose the folder that has the lesson files instead.");
      });
  }

  loadFromGitHub();
</script>
</body>
</html>
